site_name: whagent
site_description: A Python library for the WhatsApp Agent Platform API
site_url: https://elimeshi1.github.io/Whagent/
repo_url: https://github.com/Elimeshi1/Whagent
repo_name: Elimeshi1/Whagent
edit_uri: edit/main/docs/
copyright: >
  whagent is an independent library, not affiliated with or endorsed by WhatsApp.

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  font: false
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

nav:
  - Home: index.md
  - Start:
      - Getting started: getting-started.md
      - How it works: concepts.md
      - Questions and answers: faq.md
  - Guides:
      - Sending messages: sending.md
      - Receiving messages: receiving.md
      - Files and media: media.md
      - Receipts and typing: receipts.md
  - Reference:
      - Agent: agent.md
      - Client: client.md
      - Models: models.md
      - Errors: errors.md
      - Rate limits: rate-limits.md
      - Limits and formats: limits.md
  - Practice:
      - Recipes: recipes.md
      - Testing: testing.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Elimeshi1/Whagent
      name: whagent on GitHub

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "whagent"
description = "A simple Python library for the WhatsApp Agent Platform API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Eli Meshi" }]
requires-python = ">=3.9"
dynamic = ["version"]
keywords = ["whatsapp", "agent", "bot", "messaging", "api"]
dependencies = ["requests>=2.25"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://elimeshi1.github.io/Whagent/"
Source = "https://github.com/Elimeshi1/Whagent"
Issues = "https://github.com/Elimeshi1/Whagent/issues"
Changelog = "https://github.com/Elimeshi1/Whagent/releases"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.dynamic]
version = { attr = "whagent.__version__" }

[tool.setuptools.packages.find]
include = ["whagent*"]

[tool.setuptools.package-data]
whagent = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
